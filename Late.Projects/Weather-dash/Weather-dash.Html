<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="stylesheet" href="Weather-dash.Css" />
  </head>
  <body>
    <div class="sky">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
    </div>

    <div class="content">
      <h1
        style="
          text-align: center;
          color: rgb(51, 46, 46);
          padding-top: 20vh;
          font-family: sans-serif;
        "
      >
        Weather
      </h1>

      <h2 class="weather">Cloudy</h2>

      <p class="weather">
        Rain: Low precipitation
        <br />
        Humidity: 54%
        <br />
        UV: 11 extreme
      </p>

      <p class="weather">
        Fun Fact: Did you know that clouds weigh upto 500 tonnes?
      </p>
    </div>
  </body>
</html>
