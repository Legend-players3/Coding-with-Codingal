<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loops</title>
  </head>
  <body>
    <h1>Bobs Bakers</h1>
    <script>
      //list
      var bread = ["Toast", "Crossiant", "French Toast"];
      //counter
      var i;
      //Loop : inisialise counter, check, increment
      for (i = 0; i < bread.length; i++) {
        document.write(bread[i] + "<br>");
      }
      document;
    </script>
  </body>
</html>
