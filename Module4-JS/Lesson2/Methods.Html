<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Methods</title>
  </head>
  <body>
    <script>
      var text = "Toast";
      document.write(text.toUpperCase());
      document.write("<br>");
      document.write(text.toLowerCase());
      document.write("<br>");
      document.write(text.startsWith("k"));
      document.write("<br>");
      var text = "I like eating Toast";
      var pattern = new RegExp("eating");
      var result = pattern.test(text);
      document.write(result);
    </script>
  </body>
</html>
