<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone contact</title>
  </head>
  <body>
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <title>My Phone Contact</title>
        <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
        />
        <style>
          body {
            background-color: #f0f0f2;
          }
          h1 {
            color: #ff5a43;
          }
          .card-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
          }
          pre {
            font-size: 13px;
            color: #333;
          }
        </style>
      </head>
      <body class="py-4">
        <!-- Container -->
        <div class="container">
          <h1 class="mb-1">My Phone Contact</h1>
          <br />

          <!-- Contact Card -->
          <div class="card shadow-sm mb-3" style="max-width: 400px">
            <div class="card-body">
              <h5 class="card-title" style="color: #ff5a43">Contact Details</h5>
              <ul class="list-group list-group-flush">
                <li class="list-group-item">
                  <span class="card-label d-block">Name</span>
                  <strong id="name">—</strong>
                </li>
                <li class="list-group-item">
                  <span class="card-label d-block">Phone</span>
                  <strong id="phone">—</strong>
                </li>
                <li class="list-group-item">
                  <span class="card-label d-block">School</span>
                  <strong id="school">—</strong>
                </li>
                <li class="list-group-item">
                  <span class="card-label d-block">City</span>
                  <strong id="city">—</strong>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <script>
          var contact = {
            name: "Jack Daniels",
            phone: "+61 384 274 92",
            school: "Toasted Martials",
            city: "Vatican City"
          };

          var nameEl = document.getElementById("name");
          var phoneEl = document.getElementById("phone");
          var schoolEl = document.getElementById("school");
          var cityEl = document.getElementById("city");

          nameEl.textContent = contact["name"];
          phoneEl.textContent = contact["phone"];
          schoolEl.textContent = contact["school"];
          cityEl.textContent = contact["city"];
        </script>
      </body>
    </html>
  </body>
</html>
