<!DOCTYPE html>
<html lang="en">
<head>
    <title>Animal Safari</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
    body{
        position:relative;
    }
    .safari-slide{
        height: 200px;
        text-align: center;
        padding-top: 75px;
        font-size: 1.8rem;
        color: white;
        }
    .slide-forest{
        background: darkgreen;
    }
    .slide-ocean{
        background: steelblue;
    }
    .slide-desert{
        background: orange;
    }
    #forest{
        background: honeydew;
    }
    #ocean{
        background: aliceblue;
    }
    #desert{
        background: lightyellow;
    }
    .section{
        padding: 70px 20px;
        min-height: 300px;
    }
</style>

</head>
<body data-spy="scroll" data-target="#safariNav" data-offset="60">
    <div id="safariCarousal" class="carousel-slide" data-ride="carousal">
            <ol class="carousek-indicators">
                <li data-target="#safariCarousel" data-slide-to="0" class="active"></li>
                <li data-target="#safariCarousel" data-slide-to="1"></li>
                <li data-target="#safariCarousel" data-slide-to="2"></li>
            </ol>

            <div class="carousal-inner">
                <div class="carousal-item active safari-slide slide-forest>
                Forest Safari
                </div>
                <div class="carousal-item safari-slide slide-ocean>
                Ocean Safari
                </div>
                <div class="carousal-item safari-slide slide-ocean>
                Ocean Safari
                </div>
            </div>
            <a class="carousal-control-prev" href="#safariCarousal" data-slide="prev">
                <span class="carousal-control-prev-icon"></span>
            </a>
            <a class="carousal-control-next" href="#safariCarousal" data-slide="next">
                <span class="carousal-control-next-icon"></span>
            </a>
    </div>
    <nav id="safariNav" class="navbar" navbar-expand-sm navbar-dark bg-dark sticky-top>
        <span class="navbar-brand">Safari Guide</span>
        <ul class="navbar-nav">
            <li class="nav-item"> <a class="nav-link" href="#forest">Forest</a></li>
            <li class="nav-item"> <a class="nav-link" href="#ocean">Ocean</a></li>
            <li class="nav-item"> <a class="nav-link" href="#desert">Desert</a></li>
        </ul>
    </nav>

    <div class="container">
        <div id="forest" class="section">
            <h2>Forest Safari</h2>
            <p>Explore tall trees and discover lions, elephants, and monkeys!</p>
        </div>

        <div id="ocean" class="section">
            <h2>Ocean Safari</h2>
            <p>Dive deep and meet dolphins and sharks</p>
        </div>

        <div id="desert" class="section">
            <h2>Desert Safari</h2>
            <p>Trek across tge sand dunes and spot camels and scorpions</p>
        </div>
     <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
  </html>
